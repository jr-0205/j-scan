name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Core (Dart)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/jscan_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze
      - run: dart test

  apps:
    name: App ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [desktop_app, mobile_app]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  windows-build:
    name: Windows build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - uses: actions/upload-artifact@v4
        with:
          name: jscan-windows
          path: apps/desktop_app/build/windows/x64/runner/Release/
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          ./tool/build_installer.ps1 -SkipBuild -NoTestInstall
      - uses: actions/upload-artifact@v4
        with:
          name: jscan-windows-installer
          path: apps/desktop_app/build/installer/*.exe
