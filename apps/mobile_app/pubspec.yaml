name: mobile_app
description: "J-SCAN para Android: descubre la PC en la red local y prueba la conexión."
publish_to: none
version: 0.2.1+3

environment:
  sdk: ^3.6.0

dependencies:
  cunning_document_scanner: ^3.0.4
  file_picker: ^13.3.2
  flutter:
    sdk: flutter
  flutter_riverpod: 2.6.1
  flutter_secure_storage: ^11.2.0
  image: ^4.12.0
  jscan_core:
    path: ../../packages/jscan_core
  jscan_ui:
    path: ../../packages/jscan_ui
  mobile_scanner: ^7.4.3
  pdf: ^3.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
